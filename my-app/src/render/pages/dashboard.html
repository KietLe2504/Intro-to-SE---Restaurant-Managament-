<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard — RestaurantOS</title>
  <link rel="stylesheet" href="../styles/variables.css"/>
  <link rel="stylesheet" href="../styles/layout.css"/>
  <link rel="stylesheet" href="../styles/components.css"/>
  <link rel="stylesheet" href="../styles/screens.css"/>
  <style>
    .page-content {
      position: relative;
    }
    .page-content::before {
      content: '';
      position: fixed;
      top: var(--header-h);
      left: var(--sidebar-w);
      right: 0;
      bottom: 0;
      background: url("../images/bgdashboard.jpg") center/cover no-repeat;
      opacity: 0.5;
      z-index: 0;
      pointer-events: none;
    }
    .page-content > * {
      position: relative;
      z-index: 1;
    }
  </style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-area">
    <header class="top-header" id="top-header"></header>
    <div class="page-content">

      <!-- Stats -->
      <div class="stats-grid" id="stats-grid"></div>

      <div class="dash-grid">
        <!-- Recent orders -->
        <div class="card">
          <div class="card-title">
            Đơn gần đây
            <span class="card-title-sub" style="cursor:pointer;color:var(--red)" onclick="window.location.href='orders.html'">Xem tất cả →</span>
          </div>
          <div id="recent-orders"></div>
        </div>

        <!-- Table map -->
        <div class="card">
          <div class="card-title">Sơ đồ bàn <span class="card-title-sub" id="table-summary"></span></div>
          <div class="mini-table-dots" id="mini-tables"></div>
          <div class="vn-divider"></div>
          <div style="display:flex;gap:12px;font-size:11px;flex-wrap:wrap">
            <span style="color:var(--green)">● Trống</span>
            <span style="color:var(--orange)">● Chưa đầy</span>
            <span style="color:var(--red)">● Đầy</span>
            <span style="color:var(--blue)">● Đặt trước</span>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<script type="module">
  import { requireAuth }               from '../js/auth.js';
  import { renderSidebar, renderHeader } from '../js/ui.js';
  import { apiGetTables, apiGetOrders }  from '../js/api.js';

  const session = requireAuth();
  if (!session) throw new Error('Not authenticated');

  renderSidebar('dashboard');
  renderHeader({ title: 'Dashboard', sub: 'Tổng quan hôm nay', showBack: false });

  const statusBadge = { Pending: 'badge-orange', Paid: 'badge-green', Cancelled: 'badge-muted' };
  const statusLabel = { Pending: 'Chưa thanh toán', Paid: 'Đã thanh toán', Cancelled: 'Đã hủy' };

  async function loadDashboard() {
    try {
      const [tables, orders] = await Promise.all([
        apiGetTables(),
        apiGetOrders(),
      ]);

      // ── Stats ──
      const now        = new Date();
      const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);

      const paidAll    = orders.filter(o => o.status === 'Completed');
      const paidToday  = paidAll.filter(o => new Date(o.order_time) >= todayStart);
      const paidMonth  = paidAll.filter(o => new Date(o.order_time) >= monthStart);

      const unpaid     = orders.filter(o => ['Pending', 'Serving'].includes(o.status));
      const freeCount  = tables.filter(t => t.status === 'Available').length;

      const revToday   = paidToday.reduce((s, o) => s + parseFloat(o.total_amount || 0), 0);
      const revMonth   = paidMonth.reduce((s, o) => s + parseFloat(o.total_amount || 0), 0);

      document.getElementById('stats-grid').innerHTML = [
        {
          label: 'Doanh thu hôm nay',
          value: revToday.toLocaleString('vi') + 'đ',
          delta: `${paidToday.length} đơn đã thanh toán`,
          deltaClass: 'delta-up', accent: true,
        },
        {
          label: 'Doanh thu tháng này',
          value: revMonth.toLocaleString('vi') + 'đ',
          delta: `${paidMonth.length} đơn đã thanh toán`,
          deltaClass: 'delta-up', accent: true,
        },
        {
          label: 'Đơn chưa thanh toán',
          value: unpaid.length,
          delta: 'Cần xử lý',
          deltaClass: 'delta-muted', accent: false,
        },
        {
          label: 'Bàn đang trống',
          value: `${freeCount}/${tables.length}`,
          delta: `${tables.length - freeCount} bàn có khách`,
          deltaClass: 'delta-muted', accent: false,
        },
      ].map(s => `
        <div class="stat-card ${s.accent ? 'stat-card-accent' : 'stat-card-gold'}">
          <div class="stat-label">${s.label}</div>
          <div class="stat-value">${s.value}</div>
          <div class="stat-delta ${s.deltaClass}">${s.delta}</div>
        </div>
      `).join('');

      // ── Recent Orders ──
      const recent = [...orders]
        .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))
        .slice(0, 5);

      document.getElementById('recent-orders').innerHTML = recent.length
        ? recent.map(o => {
          const time = new Date(o.order_time).toLocaleString('vi', {
            hour: '2-digit', minute: '2-digit',
            day: '2-digit', month: '2-digit', year: 'numeric'
          });

          return `
            <div class="order-row" onclick="window.location.href='orders.html'" style="cursor:pointer">
              <div class="order-id">#${o.order_id?.slice(0,8)}</div>
              <div class="order-table">
                ${o.table ? `Bàn ${o.table.table_number}` : o.order_type === 'take-away' ? ' Mang về' : 'Bàn ?'}
              </div>
              <div class="order-items" style="color:var(--muted);font-size:12px">
                ${o.order_items?.length || 0} món
              </div>
              <div class="order-price">${(o.total_amount || 0).toLocaleString('vi')}đ</div>
              <div><span class="badge ${statusBadge[o.status]}">${statusLabel[o.status] || o.status}</span></div>
              <div style="color:var(--muted);font-size:12px">${time}</div>
            </div>
          `;
          }).join('')
        : '<div style="color:var(--muted);text-align:center;padding:20px">Chưa có đơn nào</div>';

      // ── Mini Table Map ──
      const dotClass = { Available: 'md-free', Occupied: 'md-full', reserved: 'md-reserved' };
      document.getElementById('mini-tables').innerHTML = tables.map(t => `
        <div class="mini-dot ${dotClass[t.status] || 'md-free'}"
             title="Bàn ${t.table_number} — ${t.status}"
             onclick="window.location.href='tables.html'">
          <span class="mini-dot-num">${t.table_number}</span>
        </div>
      `).join('');

      document.getElementById('table-summary').textContent = `${tables.length} bàn`;

    } catch (err) {
      console.error('Dashboard error:', err);
    }
  }

  loadDashboard();
</script>
</body>
</html>
