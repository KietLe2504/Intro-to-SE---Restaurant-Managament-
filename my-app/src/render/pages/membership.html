<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Thành viên — RestaurantOS</title>
  <link rel="stylesheet" href="../styles/variables.css"/>
  <link rel="stylesheet" href="../styles/layout.css"/>
  <link rel="stylesheet" href="../styles/components.css"/>
  <link rel="stylesheet" href="../styles/screens.css"/>
  <style>
    .tier-badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 10px; border-radius: 20px;
      font-size: 12px; font-weight: 600;
    }
    .tier-bronze  { background: rgba(205,127,50,0.15); color: #8B4513; }
    .tier-silver  { background: rgba(168,169,173,0.2); color: #666; }
    .tier-gold    { background: rgba(212,160,23,0.2);  color: var(--gold-deep); }
    .tier-diamond { background: rgba(96,165,250,0.2);  color: var(--blue); }
    .tier-none    { background: rgba(156,128,112,0.15); color: var(--muted); }

    .progress-bar {
      height: 6px; background: var(--surface2);
      border-radius: 3px; overflow: hidden; margin-top: 6px;
    }
    .progress-fill {
      height: 100%; border-radius: 3px;
      background: linear-gradient(90deg, var(--red), var(--gold));
      transition: width 0.4s ease;
    }

    .tier-row {
      display: flex; align-items: center; gap: 12px;
      padding: 12px; border: 1px solid var(--border);
      border-radius: var(--radius); margin-bottom: 8px;
    }
    .tier-row-info { flex: 1; }
    .tier-row-name { font-size: 14px; font-weight: 600; }
    .tier-row-detail { font-size: 12px; color: var(--muted); margin-top: 2px; }
  </style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-area">
    <header class="top-header" id="top-header"></header>
    <div class="page-content">

      <!-- ══ VIEW: DANH SÁCH ══ -->
      <div id="view-list">
        <div class="page-toolbar">
          <input class="search-input" placeholder="🔍 Tìm theo tên hoặc SĐT..."
                 id="member-search" oninput="renderList()"/>
          <select class="form-select" id="tier-filter-select" style="width:160px" onchange="onTierFilterChange()">
            <option value="all">Tất cả hạng</option>
          </select>
          <button class="btn btn-ghost" id="manage-tiers-btn" style="display:none"
                  onclick="openTierManageModal()">Quản lý hạng</button>
          <button class="btn btn-ghost" id="recalc-btn" style="display:none"
                  onclick="recalculateTiers()">Cập nhật hạng</button>
          <button class="btn btn-primary" onclick="openCreateModal()">+ Đăng ký thành viên</button>
        </div>

        <!-- Stats -->
        <div class="stats-grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:20px"
             id="tier-stats"></div>

        <!-- List -->
        <div class="card" style="padding:0;overflow:hidden">
          <table class="data-table">
            <thead>
              <tr>
                <th>Thành viên</th>
                <th>SĐT</th>
                <th>Hạng</th>
                <th>Điểm hiện có</th>
                <th>Số đơn</th>
                <th>Ngày đăng ký</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="member-tbody">
              <tr><td colspan="7" style="text-align:center;padding:30px;color:var(--muted)">
                Đang tải...
              </td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- ══ VIEW: CHI TIẾT MEMBER ══ -->
      <div id="view-detail" style="display:none">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:24px">
          <button class="btn btn-ghost" onclick="showList()">← Quay lại</button>
        </div>

        <div style="display:grid;grid-template-columns:1fr 320px;gap:16px">
          <div>
            <div class="card" style="margin-bottom:14px" id="detail-card"></div>
            <div class="card">
              <div class="card-title">Lịch sử đơn hàng</div>
              <div id="detail-history"></div>
            </div>
          </div>
          <div class="card" id="detail-points-card"></div>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- Modal tạo thành viên -->
<div class="modal-backdrop" id="create-modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Đăng ký thành viên mới</div>
      <button class="modal-close" onclick="closeCreateModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Họ và tên *</label>
        <input class="form-input" id="new-name" placeholder="Nguyễn Văn A"/>
      </div>
      <div class="form-group">
        <label class="form-label">Số điện thoại *</label>
        <input class="form-input" id="new-phone" type="tel" placeholder="0901234567"/>
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input class="form-input" id="new-email" type="email" placeholder="example@email.com"/>
      </div>
      <div id="create-error"
           style="color:var(--red);font-size:13px;padding:10px;background:var(--red-bg);
                  border-radius:var(--radius);display:none"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeCreateModal()">Hủy</button>
      <button class="btn btn-primary" id="create-btn" onclick="createMember()">Đăng ký</button>
    </div>
  </div>
</div>

<!-- Modal điều chỉnh điểm -->
<div class="modal-backdrop" id="adjust-points-modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Điều chỉnh điểm</div>
      <button class="modal-close" onclick="closeAdjustPointsModal()">×</button>
    </div>
    <div class="modal-body">
      <div style="font-size:13px;color:var(--muted);margin-bottom:14px" id="adjust-points-info"></div>
      <div class="form-group">
        <label class="form-label">Số điểm điều chỉnh</label>
        <input class="form-input" id="adjust-points-input" type="number"
               placeholder="Số dương để cộng, số âm để trừ. VD: 500 hoặc -200"/>
        <div style="font-size:11px;color:var(--muted);margin-top:4px">
          Nhập số dương để cộng điểm, số âm để trừ điểm.
        </div>
      </div>
      <div id="adjust-points-error"
           style="color:var(--red);font-size:13px;padding:10px;background:var(--red-bg);
                  border-radius:var(--radius);display:none"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeAdjustPointsModal()">Hủy</button>
      <button class="btn btn-primary" id="adjust-points-save-btn" onclick="saveAdjustPoints()">Xác nhận</button>
    </div>
  </div>
</div>

<!-- Modal quản lý hạng thành viên -->
<div class="modal-backdrop" id="tier-manage-modal">
  <div class="modal" style="max-width:600px">
    <div class="modal-header">
      <div class="modal-title">Quản lý hạng thành viên</div>
      <button class="modal-close" onclick="closeTierManageModal()">×</button>
    </div>
    <div class="modal-body">
      <button class="btn btn-primary btn-sm" style="margin-bottom:14px"
              onclick="openTierFormModal()">+ Thêm hạng mới</button>
      <div id="tier-list"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeTierManageModal()">Đóng</button>
    </div>
  </div>
</div>

<!-- Modal tạo/sửa 1 tier -->
<div class="modal-backdrop" id="tier-form-modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="tier-form-title">Thêm hạng mới</div>
      <button class="modal-close" onclick="closeTierFormModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Tên hạng *</label>
        <input class="form-input" id="tf-level" placeholder="VD: Platinum"/>
      </div>
      <div class="form-group">
        <label class="form-label">Chi tiêu tối thiểu (đ) *</label>
        <input class="form-input" id="tf-min-spend" type="number" min="0" placeholder="5000000"/>
      </div>
      <div class="form-group">
        <label class="form-label">Tỉ lệ tích điểm (%) *</label>
        <input class="form-input" id="tf-point-rate" type="number" min="0" max="100" placeholder="3"/>
      </div>
      <div class="form-group">
        <label class="form-label">Mô tả quyền lợi</label>
        <input class="form-input" id="tf-benefit" placeholder="VD: Tích lũy 3% giá trị đơn"/>
      </div>
      <div id="tier-form-error"
           style="color:var(--red);font-size:13px;padding:10px;background:var(--red-bg);
                  border-radius:var(--radius);display:none"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeTierFormModal()">Hủy</button>
      <button class="btn btn-primary" id="tier-form-save-btn" onclick="saveTier()">Lưu</button>
    </div>
  </div>
</div>

<script type="module">
  import { requireAuth } from '../js/auth.js';
  import { renderSidebar, renderHeader, showToast, confirmDialog } from '../js/ui.js';
  import {
    apiGetCustomers, apiGetCustomer,
    apiCreateCustomer, apiUpdateCustomerPoints,
    apiGetMemberships, apiCreateMembership,
    apiUpdateMembership, apiDeleteMembership, apiRecalculateTiers,
  } from '../js/api.js';

  const session = requireAuth();
  if (!session) throw new Error();
  renderSidebar('membership');

  if (session.role === 'Manager') {
    document.getElementById('manage-tiers-btn').style.display = '';
    document.getElementById('recalc-btn').style.display = '';
  }

  // ── State ─────────────────────────────────────────────────
  let allCustomers   = [];
  let allTiers       = [];   // từ /api/memberships
  let tierFilter     = 'all';
  let currentId      = null;
  let editingTierId  = null;
  let adjustingCustomerId = null;

  // Map level (tiếng Việt thực tế trong DB) → CSS class / badge
  const TIER_CLASS = {
    'Đồng':      'tier-bronze',
    'Bạc':       'tier-silver',
    'Vàng':      'tier-gold',
    'Kim Cương': 'tier-diamond',
  };
  const TIER_BADGE = {
    'Đồng':      '🥉',
    'Bạc':       '🥈',
    'Vàng':      '🥇',
    'Kim Cương': '💎',
  };

  // ── Recalculate tiers (Manager) ──
  window.recalculateTiers = async function() {
    confirmDialog({
      title: 'Cập nhật hạng thành viên',
      body: 'Hệ thống sẽ tính lại tổng chi tiêu và hạng cho tất cả khách hàng dựa trên các đơn đã thanh toán. Tiếp tục?',
      confirmLabel: 'Cập nhật', confirmClass: 'btn-primary',
      onConfirm: async () => {
        try {
          const result = await apiRecalculateTiers();
          showToast(result.message, 'success');
          allCustomers = await apiGetCustomers();
          renderStats();
          renderList();
        } catch (err) {
          showToast('Lỗi: ' + err.message, 'error');
        }
      },
    });
  };

  // ── Tier management modal ──
  window.openTierManageModal = function() {
    renderTierList();
    document.getElementById('tier-manage-modal').classList.add('open');
  };

  window.closeTierManageModal = function() {
    document.getElementById('tier-manage-modal').classList.remove('open');
  };

  function renderTierList() {
    document.getElementById('tier-list').innerHTML = allTiers.map(t => `
      <div class="tier-row">
        <span style="font-size:20px">${TIER_BADGE[t.level] || '🏅'}</span>
        <div class="tier-row-info">
          <div class="tier-row-name">${t.level}</div>
          <div class="tier-row-detail">
            Chi tiêu tối thiểu: ${parseFloat(t.min_spend).toLocaleString('vi')}đ ·
            Tích điểm: ${parseFloat(t.point_rate).toFixed(0)}% ·
            ${t._count?.customers ?? 0} khách hàng
          </div>
        </div>
        <button class="btn btn-sm btn-ghost" onclick="openTierFormModal('${t.membership_id}')">Sửa</button>
        <button class="btn btn-sm btn-danger" onclick="deleteTier('${t.membership_id}', '${t.level}')">Xóa</button>
      </div>
    `).join('') || '<div style="color:var(--muted);text-align:center;padding:20px">Chưa có hạng nào</div>';
  }

  // ── Tier form modal (tạo/sửa) ──
  window.openTierFormModal = function(tierId = null) {
    editingTierId = tierId;
    document.getElementById('tier-form-error').style.display = 'none';

    if (tierId) {
      const t = allTiers.find(t => t.membership_id === tierId);
      document.getElementById('tier-form-title').textContent = 'Sửa hạng thành viên';
      document.getElementById('tf-level').value      = t.level;
      document.getElementById('tf-level').disabled   = true;
      document.getElementById('tf-min-spend').value  = t.min_spend;
      document.getElementById('tf-point-rate').value = t.point_rate;
      document.getElementById('tf-benefit').value    = t.benefit_description || '';
    } else {
      document.getElementById('tier-form-title').textContent = 'Thêm hạng mới';
      document.getElementById('tf-level').value      = '';
      document.getElementById('tf-level').disabled   = false;
      document.getElementById('tf-min-spend').value  = '';
      document.getElementById('tf-point-rate').value = '';
      document.getElementById('tf-benefit').value    = '';
    }

    document.getElementById('tier-form-modal').classList.add('open');
  };

  window.closeTierFormModal = function() {
    document.getElementById('tier-form-modal').classList.remove('open');
    editingTierId = null;
  };

  window.saveTier = async function() {
    const errEl = document.getElementById('tier-form-error');
    errEl.style.display = 'none';

    const level      = document.getElementById('tf-level').value.trim();
    const min_spend  = parseFloat(document.getElementById('tf-min-spend').value);
    const point_rate = parseFloat(document.getElementById('tf-point-rate').value);
    const benefit    = document.getElementById('tf-benefit').value.trim();

    if (!editingTierId && !level) {
      errEl.textContent = 'Vui lòng nhập tên hạng.'; errEl.style.display = 'block'; return;
    }
    if (isNaN(min_spend) || min_spend < 0) {
      errEl.textContent = 'Chi tiêu tối thiểu không hợp lệ.'; errEl.style.display = 'block'; return;
    }
    if (isNaN(point_rate) || point_rate < 0) {
      errEl.textContent = 'Tỉ lệ tích điểm không hợp lệ.'; errEl.style.display = 'block'; return;
    }

    try {
      if (editingTierId) {
        const updated = await apiUpdateMembership(editingTierId, {
          min_spend, point_rate, benefit_description: benefit || null,
        });
        const idx = allTiers.findIndex(t => t.membership_id === editingTierId);
        if (idx >= 0) allTiers[idx] = { ...allTiers[idx], ...updated };
        showToast('Đã cập nhật hạng thành viên!', 'success');
      } else {
        const created = await apiCreateMembership({
          level, min_spend, point_rate, benefit_description: benefit || null,
        });
        allTiers.push(created);
        allTiers.sort((a, b) => a.min_spend - b.min_spend);
        showToast('Đã thêm hạng mới!', 'success');
      }
      closeTierFormModal();
      renderTierList();
      renderTierFilterChips();
      renderStats();
    } catch (err) {
      errEl.textContent = err.message;
      errEl.style.display = 'block';
    }
  };

  window.deleteTier = function(tierId, level) {
    confirmDialog({
      title: 'Xóa hạng thành viên',
      body: `Bạn có chắc muốn xóa hạng <strong>${level}</strong>?`,
      confirmLabel: 'Xóa', confirmClass: 'btn-danger',
      onConfirm: async () => {
        try {
          await apiDeleteMembership(tierId);
          allTiers = allTiers.filter(t => t.membership_id !== tierId);
          showToast('Đã xóa hạng thành viên', 'success');
          renderTierList();
          renderTierFilterChips();
          renderStats();
        } catch (err) {
          showToast('Lỗi: ' + err.message, 'error');
        }
      },
    });
  };

  // ── Load data ─────────────────────────────────────────────
  async function init() {
    try {
      [allTiers, allCustomers] = await Promise.all([
        apiGetMemberships(),
        apiGetCustomers(),
      ]);
      renderHeader({
        title: 'Thành viên',
        sub: `${allCustomers.length} thành viên`,
        showBack: true, backUrl: 'dashboard.html',
      });
      renderTierFilterChips();
      renderStats();
      renderList();
    } catch (err) {
      showToast('Không thể tải dữ liệu: ' + err.message, 'error');
    }
  }

  // ── Tier filter dropdown ───────────────────────────────────
  function renderTierFilterChips() {
    const sel = document.getElementById('tier-filter-select');
    sel.innerHTML = '<option value="all">Tất cả hạng</option>' +
      allTiers.map(t => `
        <option value="${t.level}">${TIER_BADGE[t.level] || ''} ${t.level}</option>
      `).join('');
  }

  window.onTierFilterChange = function() {
    tierFilter = document.getElementById('tier-filter-select').value;
    renderList();
  };

  // ── Stats ─────────────────────────────────────────────────
  function renderStats() {
    document.getElementById('tier-stats').innerHTML = allTiers.map(t => {
      const count = allCustomers.filter(c => c.membership?.level === t.level).length;
      return `
        <div class="stat-card stat-card-gold">
          <div class="stat-label">${TIER_BADGE[t.level] || ''} ${t.level}</div>
          <div class="stat-value" style="font-size:24px">${count}</div>
          <div class="stat-delta delta-muted">Tích lũy ${parseFloat(t.point_rate).toFixed(0)}%</div>
        </div>
      `;
    }).join('');
  }

  // ── Render list ───────────────────────────────────────────
  window.renderList = function() {
    const q = document.getElementById('member-search').value.toLowerCase();
    const list = allCustomers.filter(c => {
      if (tierFilter !== 'all' && c.membership?.level !== tierFilter) return false;
      return c.name.toLowerCase().includes(q) || (c.phone || '').includes(q);
    });

    document.getElementById('member-tbody').innerHTML = list.map(c => {
      const tier      = c.membership;
      const tierClass = tier ? (TIER_CLASS[tier.level] || 'tier-none') : 'tier-none';
      const tierBadge = tier ? (TIER_BADGE[tier.level] || '') : '';
      const tierLabel = tier?.level || 'Chưa có hạng';
      return `
        <tr style="cursor:pointer" onclick="showDetail('${c.customer_id}')">
          <td style="font-weight:500">${c.name}</td>
          <td style="color:var(--muted)">${c.phone}</td>
          <td>
            <span class="tier-badge ${tierClass}">
              ${tierBadge} ${tierLabel}
            </span>
          </td>
          <td style="color:var(--gold-deep);font-weight:600">
            ${(c.total_points || 0).toLocaleString('vi')} điểm
          </td>
          <td>
            <span class="badge badge-muted">${c._count?.orders ?? 0}</span>
          </td>
          <td style="color:var(--muted);font-size:12px">
            ${c.created_at ? new Date(c.created_at).toLocaleDateString('vi') : '—'}
          </td>
          <td>
            <button class="btn btn-sm btn-ghost"
                    onclick="event.stopPropagation();showDetail('${c.customer_id}')">
              Chi tiết
            </button>
          </td>
        </tr>
      `;
    }).join('') || `
      <tr><td colspan="7" style="text-align:center;padding:30px;color:var(--muted)">
        Không có thành viên nào
      </td></tr>`;
  };

  // ── Detail ────────────────────────────────────────────────
  window.showDetail = async function(customerId) {
    currentId = customerId;
    show('view-detail');
    document.getElementById('detail-card').innerHTML =
      '<div style="padding:20px;color:var(--muted)">Đang tải...</div>';

    try {
      const c = await apiGetCustomer(customerId);

      const tier      = c.membership;
      const tierClass = tier ? (TIER_CLASS[tier.level] || 'tier-none') : 'tier-none';
      const tierBadge = tier ? (TIER_BADGE[tier.level] || '') : '';
      const tierLabel = tier?.level || 'Chưa có hạng';

      const tierIdx   = allTiers.findIndex(t => t.membership_id === tier?.membership_id);
      const nextTier  = allTiers[tierIdx + 1] || null;
      const curMin    = tier ? parseFloat(tier.min_spend) : 0;
      const nextMin   = nextTier ? parseFloat(nextTier.min_spend) : null;
      const totalSpend = c.orders?.reduce((sum, o) => sum + parseFloat(o.total_amount || 0), 0) || 0;
      const progress   = nextMin
        ? Math.min(100, Math.round((totalSpend - curMin) / (nextMin - curMin) * 100))
        : 100;

      document.getElementById('detail-card').innerHTML = `
        <div style="display:flex;align-items:center;gap:16px;margin-bottom:20px">
          <div style="width:56px;height:56px;border-radius:50%;
                      background:linear-gradient(135deg,var(--red),var(--gold));
                      display:flex;align-items:center;justify-content:center;
                      font-size:22px;font-weight:700;color:#fff;flex-shrink:0">
            ${c.name[0]}
          </div>
          <div>
            <div style="font-family:var(--font-display);font-size:20px;font-weight:700">${c.name}</div>
            <div style="font-size:13px;color:var(--muted)">${c.phone}</div>
            ${c.email ? `<div style="font-size:12px;color:var(--muted)">${c.email}</div>` : ''}
          </div>
          <span class="tier-badge ${tierClass}"
                style="margin-left:auto;font-size:14px;padding:5px 14px">
            ${tierBadge} ${tierLabel}
          </span>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px">
          <div style="background:var(--surface2);padding:14px;border-radius:var(--radius)">
            <div class="stat-label">Tổng chi tiêu (10 đơn gần nhất)</div>
            <div style="font-family:var(--font-display);font-size:20px;font-weight:700;color:var(--red)">
              ${totalSpend.toLocaleString('vi')}đ
            </div>
          </div>
          <div style="background:var(--surface2);padding:14px;border-radius:var(--radius)">
            <div class="stat-label">Điểm tích lũy</div>
            <div style="font-family:var(--font-display);font-size:20px;font-weight:700;color:var(--gold-deep)">
              ${(c.total_points || 0).toLocaleString('vi')} điểm
            </div>
          </div>
        </div>

        ${nextTier ? `
          <div>
            <div style="display:flex;justify-content:space-between;font-size:12px;
                        color:var(--muted);margin-bottom:4px">
              <span>${tierBadge} ${tierLabel}</span>
              <span>Lên ${TIER_BADGE[nextTier.level] || ''} ${nextTier.level}
                cần ${parseFloat(nextTier.min_spend).toLocaleString('vi')}đ</span>
            </div>
            <div class="progress-bar">
              <div class="progress-fill" style="width:${Math.max(2, progress)}%"></div>
            </div>
          </div>
        ` : tier ? `
          <div style="text-align:center;font-size:13px;color:var(--gold-deep);
                      padding:8px;background:var(--gold-bg);border-radius:var(--radius)">
            💎 Đã đạt hạng cao nhất!
          </div>
        ` : ''}
      `;

      // Points card
      document.getElementById('detail-points-card').innerHTML = `
        <div class="card-title">Điểm & Quyền lợi</div>
        <div style="font-size:13px;display:flex;flex-direction:column;gap:10px">
          <div style="display:flex;justify-content:space-between">
            <span style="color:var(--muted)">Điểm hiện có</span>
            <strong style="color:var(--gold-deep)">${(c.total_points || 0).toLocaleString('vi')} điểm</strong>
          </div>
          <div style="display:flex;justify-content:space-between">
            <span style="color:var(--muted)">Tỉ lệ tích điểm</span>
            <strong>${tier ? parseFloat(tier.point_rate).toFixed(0) : 0}% giá trị đơn</strong>
          </div>
          ${tier?.benefit_description ? `
            <div style="display:flex;justify-content:space-between">
              <span style="color:var(--muted)">Quyền lợi</span>
              <strong style="text-align:right;max-width:160px">${tier.benefit_description}</strong>
            </div>
          ` : ''}
          <div class="vn-divider"></div>
          <div style="background:var(--gold-bg);border-radius:var(--radius);
                      padding:12px;font-size:12px;color:var(--gold-deep)">
            💡 1 điểm = 1đ khi thanh toán
          </div>
          ${session.role === 'Manager' ? `
            <button class="btn btn-ghost btn-full"
                    onclick="adjustPoints('${c.customer_id}', ${c.total_points || 0}, '${c.name.replace(/'/g,"\\'")}')">
              Điều chỉnh điểm
            </button>
          ` : ''}
        </div>
      `;

      // Lịch sử đơn
      const orders = c.orders || [];
      document.getElementById('detail-history').innerHTML = orders.length
        ? orders.map(o => `
            <div style="display:flex;align-items:center;gap:12px;padding:10px 0;
                        border-bottom:1px solid var(--border)">
              <div style="flex:1">
                <div style="font-size:13px;font-weight:500">
                  Đơn #${o.order_id.slice(-6).toUpperCase()}
                </div>
                <div style="font-size:11px;color:var(--muted)">
                  ${new Date(o.order_time).toLocaleDateString('vi')}
                </div>
              </div>
              <div style="text-align:right">
                <div style="font-size:13px;font-weight:600">
                  ${parseFloat(o.total_amount || 0).toLocaleString('vi')}đ
                </div>
                <span class="badge badge-muted" style="font-size:10px">${o.status}</span>
              </div>
            </div>
          `).join('')
        : '<div style="color:var(--muted);text-align:center;padding:20px">Chưa có đơn nào</div>';

    } catch (err) {
      document.getElementById('detail-card').innerHTML =
        `<div style="color:var(--red);padding:20px">Lỗi tải dữ liệu: ${err.message}</div>`;
    }
  };

  // ── Tạo thành viên ────────────────────────────────────────
  window.openCreateModal = function() {
    ['new-name','new-phone','new-email'].forEach(id =>
      document.getElementById(id).value = '');
    document.getElementById('create-error').style.display = 'none';
    document.getElementById('create-modal').classList.add('open');
  };

  window.closeCreateModal = function() {
    document.getElementById('create-modal').classList.remove('open');
  };

  window.createMember = async function() {
    const errEl = document.getElementById('create-error');
    const btn   = document.getElementById('create-btn');
    errEl.style.display = 'none';

    const name  = document.getElementById('new-name').value.trim();
    const phone = document.getElementById('new-phone').value.trim();
    const email = document.getElementById('new-email').value.trim();

    if (!name)  return showErr('Vui lòng nhập họ tên.');
    if (!phone) return showErr('Vui lòng nhập số điện thoại.');

    btn.disabled = true; btn.textContent = 'Đang đăng ký...';
    try {
      const created = await apiCreateCustomer({ name, phone, email: email || undefined });
      allCustomers.unshift(created);
      showToast(`Đã đăng ký thành viên ${name}!`, 'success');
      closeCreateModal();
      renderStats();
      renderList();
    } catch (err) {
      showErr(err.message);
    } finally {
      btn.disabled = false; btn.textContent = 'Đăng ký';
    }

    function showErr(msg) {
      errEl.textContent = msg;
      errEl.style.display = 'block';
    }
  };

  // ── Điều chỉnh điểm (Manager) ────────────────────────────
  window.adjustPoints = function(customerId, currentPoints, name) {
    adjustingCustomerId = customerId;
    document.getElementById('adjust-points-info').innerHTML =
      `Điều chỉnh điểm cho <strong>${name}</strong><br>Hiện có: ${currentPoints.toLocaleString('vi')} điểm`;
    document.getElementById('adjust-points-input').value = '';
    document.getElementById('adjust-points-error').style.display = 'none';
    document.getElementById('adjust-points-modal').classList.add('open');
  };

  window.closeAdjustPointsModal = function() {
    document.getElementById('adjust-points-modal').classList.remove('open');
    adjustingCustomerId = null;
  };

  window.saveAdjustPoints = function() {
    const errEl = document.getElementById('adjust-points-error');
    const input = document.getElementById('adjust-points-input').value;
    const delta = parseInt(input);

    if (isNaN(delta) || delta === 0) {
      errEl.textContent = 'Vui lòng nhập số điểm hợp lệ (khác 0).';
      errEl.style.display = 'block';
      return;
    }

    apiUpdateCustomerPoints(adjustingCustomerId, delta)
      .then(updated => {
        const idx = allCustomers.findIndex(c => c.customer_id === adjustingCustomerId);
        if (idx !== -1) allCustomers[idx].total_points = updated.total_points;
        showToast(
          `Đã ${delta >= 0 ? 'cộng' : 'trừ'} ${Math.abs(delta).toLocaleString('vi')} điểm`,
          'success'
        );
        closeAdjustPointsModal();
        showDetail(adjustingCustomerId);
      })
      .catch(err => {
        errEl.textContent = err.message;
        errEl.style.display = 'block';
      });
  };

  // ── Utils ─────────────────────────────────────────────────
  function show(viewId) {
    ['view-list','view-detail'].forEach(id =>
      document.getElementById(id).style.display = id === viewId ? '' : 'none');
  }

  window.showList = function() {
    currentId = null;
    show('view-list');
  };

  document.getElementById('create-modal').addEventListener('click', e => {
    if (e.target === document.getElementById('create-modal')) closeCreateModal();
  });
  document.getElementById('adjust-points-modal').addEventListener('click', e => {
    if (e.target === document.getElementById('adjust-points-modal')) closeAdjustPointsModal();
  });
  ['tier-manage-modal', 'tier-form-modal'].forEach(id => {
    document.getElementById(id).addEventListener('click', e => {
      if (e.target === document.getElementById(id))
        document.getElementById(id).classList.remove('open');
    });
  });

  init();
</script>
</body>
</html>
