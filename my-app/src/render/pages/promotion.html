<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Khuyến mãi — RestaurantOS</title>
  <link rel="stylesheet" href="../styles/variables.css"/>
  <link rel="stylesheet" href="../styles/layout.css"/>
  <link rel="stylesheet" href="../styles/components.css"/>
  <link rel="stylesheet" href="../styles/screens.css"/>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-area">
    <header class="top-header" id="top-header"></header>
    <div class="page-content">

      <div class="page-toolbar">
        <input class="search-input" placeholder="🔍 Tìm khuyến mãi..."
               id="promo-search" oninput="renderList()"/>
        <div class="filter-group">
          <div class="filter-chip active" data-af="all"      onclick="setFilter('all')">Tất cả</div>
          <div class="filter-chip"        data-af="active"   onclick="setFilter('active')">Đang hoạt động</div>
          <div class="filter-chip"        data-af="inactive" onclick="setFilter('inactive')">Tạm dừng</div>
        </div>
        <button class="btn btn-primary" onclick="openModal()">+ Tạo khuyến mãi</button>
      </div>

      <div class="card" style="padding:0;overflow:hidden">
        <table class="data-table">
          <thead>
            <tr>
              <th>Tên khuyến mãi</th>
              <th>Mã</th>
              <th>Loại sự kiện</th>
              <th>Loại giảm</th>
              <th>Giá trị</th>
              <th>Đơn tối thiểu</th>
              <th>Trạng thái</th>
              <th>Thời gian</th>
              <th>Thao tác</th>
            </tr>
          </thead>
          <tbody id="promo-tbody">
            <tr><td colspan="9" style="text-align:center;padding:30px;color:var(--muted)">
              Đang tải...
            </td></tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>
</div>

<!-- Modal tạo / sửa -->
<div class="modal-backdrop" id="promo-modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-title">Tạo khuyến mãi</div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">

      <div class="form-group">
        <label class="form-label">Tên khuyến mãi *</label>
        <input class="form-input" id="f-name" placeholder="VD: Giảm 10% cuối tuần"/>
      </div>

      <div class="form-group">
        <label class="form-label">Mã khuyến mãi *</label>
        <input class="form-input" id="f-code" placeholder="VD: WEEKEND10"
               style="text-transform:uppercase" oninput="this.value=this.value.toUpperCase()"/>
        <div style="font-size:11px;color:var(--muted);margin-top:4px">
          Chỉ chữ hoa và số, không dấu cách. Không thể sửa sau khi tạo.
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Loại sự kiện *</label>
        <select class="form-input" id="f-event-type">
          <option value="general">Chung</option>
          <option value="birthday">Sinh nhật</option>
          <option value="holiday">Ngày lễ</option>
          <option value="weekend">Cuối tuần</option>
          <option value="loyalty">Khách thân thiết</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Loại giảm giá *</label>
        <div style="display:flex;gap:10px">
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px">
            <input type="radio" name="f-type" value="percent" checked
                   onchange="onTypeChange()" style="accent-color:var(--red)"/>
            Giảm theo % (VD: 10%)
          </label>
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px">
            <input type="radio" name="f-type" value="fixed"
                   onchange="onTypeChange()" style="accent-color:var(--red)"/>
            Giảm tiền trực tiếp (VD: 50,000đ)
          </label>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" id="f-value-label">Giá trị giảm (%) *</label>
        <input class="form-input" id="f-value" type="number" min="1" placeholder="10"/>
      </div>

      <div class="form-group">
        <label class="form-label">Đơn tối thiểu (đ)</label>
        <input class="form-input" id="f-min" type="number" min="0"
               placeholder="0 = không giới hạn"/>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="form-group">
          <label class="form-label">Ngày bắt đầu</label>
          <input class="form-input" id="f-start" type="date"/>
        </div>
        <div class="form-group">
          <label class="form-label">Ngày kết thúc</label>
          <input class="form-input" id="f-end" type="date"/>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Mô tả</label>
        <input class="form-input" id="f-desc" placeholder="Mô tả ngắn (tuỳ chọn)"/>
      </div>

      <div class="form-group">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px">
          <input type="checkbox" id="f-active" checked style="accent-color:var(--red)"/>
          Kích hoạt ngay
        </label>
      </div>

      <div id="modal-error"
           style="color:var(--red);font-size:13px;padding:10px 14px;
                  background:var(--red-bg);border-radius:var(--radius);display:none">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Hủy</button>
      <button class="btn btn-primary" id="save-btn" onclick="savePromo()">Lưu</button>
    </div>
  </div>
</div>

<script type="module">
  import { requireManager }  from '../js/auth.js';
  import { renderSidebar, renderHeader, showToast, confirmDialog } from '../js/ui.js';
  import {
    apiGetPromotions, apiCreatePromotion,
    apiUpdatePromotion, apiDeletePromotion,
  } from '../js/api.js';

  const session = requireManager();
  if (!session) throw new Error();
  renderSidebar('promotion');
  renderHeader({
    title: 'Quản lý khuyến mãi',
    sub: 'Tạo và quản lý mã giảm giá',
    showBack: true, backUrl: 'dashboard.html',
  });

  let allPromos    = [];   // cache từ API
  let activeFilter = 'all';
  let editingId    = null;

  // ── Load dữ liệu từ API ───────────────────────────────────
  async function loadPromos() {
    try {
      const data = await apiGetPromotions();
      allPromos = data || [];
      renderList();
    } catch (err) {
      showToast('Không thể tải danh sách khuyến mãi: ' + err.message, 'error');
    }
  }

  // ── Filter ────────────────────────────────────────────────
  window.setFilter = function(f) {
    activeFilter = f;
    document.querySelectorAll('[data-af]').forEach(c =>
      c.classList.toggle('active', c.dataset.af === f));
    renderList();
  };

  // ── Render danh sách ──────────────────────────────────────
  window.renderList = function() {
    const q = document.getElementById('promo-search').value.toLowerCase();
    const list = allPromos.filter(p => {
      if (activeFilter === 'active'   && !p.is_active) return false;
      if (activeFilter === 'inactive' &&  p.is_active) return false;
      return p.name.toLowerCase().includes(q) || p.code.toLowerCase().includes(q);
    });

    const fmtDate = d => d ? new Date(d).toLocaleDateString('vi') : '—';
    const fmtTime = (s, e) => {
      if (!s && !e) return '<span style="color:var(--muted)">Không giới hạn</span>';
      return `${fmtDate(s)} → ${fmtDate(e)}`;
    };

    document.getElementById('promo-tbody').innerHTML = list.map(p => `
      <tr>
        <td style="font-weight:500">${p.name}</td>
        <td>
          <code style="background:var(--surface2);padding:2px 8px;border-radius:6px;
                       font-size:12px;color:var(--red);font-family:monospace">
            ${p.code}
          </code>
        </td>
        <td style="color:var(--muted);font-size:12px">${p.event_type || '—'}</td>
        <td>${p.type === 'percent' ? 'Giảm %' : 'Giảm tiền'}</td>
        <td style="font-weight:600;color:var(--red)">
          ${p.type === 'percent'
            ? `${p.value}%`
            : `${Number(p.value).toLocaleString('vi')}đ`}
        </td>
        <td style="color:var(--muted)">
          ${p.min_order > 0 ? Number(p.min_order).toLocaleString('vi') + 'đ' : 'Không giới hạn'}
        </td>
        <td>
          <span class="badge ${p.is_active ? 'badge-green' : 'badge-muted'}">
            ${p.is_active ? 'Đang hoạt động' : 'Tạm dừng'}
          </span>
        </td>
        <td style="font-size:12px">${fmtTime(p.start_date, p.end_date)}</td>
        <td>
          <div style="display:flex;gap:4px">
            <button class="btn btn-sm btn-ghost"
                    onclick="editPromo('${p.event_id}')">Sửa</button>
            <button class="btn btn-sm ${p.is_active ? 'btn-danger' : 'btn-gold'}"
                    onclick="toggleActive('${p.event_id}', ${p.is_active})">
              ${p.is_active ? 'Tạm dừng' : 'Kích hoạt'}
            </button>
            <button class="btn btn-sm btn-danger"
                    onclick="deletePromo('${p.event_id}', '${p.name.replace(/'/g,"\\'")}')">Xóa</button>
          </div>
        </td>
      </tr>
    `).join('') || `
      <tr><td colspan="9" style="text-align:center;padding:30px;color:var(--muted)">
        Không có khuyến mãi nào
      </td></tr>`;
  };

  // ── Modal helpers ─────────────────────────────────────────
  function resetForm() {
    document.getElementById('f-name').value  = '';
    document.getElementById('f-code').value  = '';
    document.getElementById('f-value').value = '';
    document.getElementById('f-min').value   = '';
    document.getElementById('f-start').value = '';
    document.getElementById('f-end').value   = '';
    document.getElementById('f-desc').value  = '';
    document.getElementById('f-active').checked = true;
    document.getElementById('f-event-type').value = 'general';
    document.querySelector('[name="f-type"][value="percent"]').checked = true;
    onTypeChange();
    document.getElementById('modal-error').style.display = 'none';
  }

  window.openModal = function() {
    editingId = null;
    document.getElementById('modal-title').textContent = 'Tạo khuyến mãi mới';
    document.getElementById('f-code').disabled = false;
    resetForm();
    document.getElementById('promo-modal').classList.add('open');
  };

  window.editPromo = function(id) {
    const p = allPromos.find(p => p.event_id === id);
    if (!p) return;
    editingId = id;
    document.getElementById('modal-title').textContent = 'Sửa khuyến mãi';

    document.getElementById('f-name').value  = p.name;
    document.getElementById('f-code').value  = p.code;
    document.getElementById('f-code').disabled = true; // code không cho sửa
    document.getElementById('f-value').value = p.value;
    document.getElementById('f-min').value   = p.min_order || '';
    document.getElementById('f-desc').value  = p.description || '';
    document.getElementById('f-active').checked = p.is_active;
    document.getElementById('f-event-type').value = p.event_type || 'general';
    document.getElementById('f-start').value =
      p.start_date ? p.start_date.split('T')[0] : '';
    document.getElementById('f-end').value =
      p.end_date ? p.end_date.split('T')[0] : '';
    document.querySelector(`[name="f-type"][value="${p.type}"]`).checked = true;
    onTypeChange();
    document.getElementById('modal-error').style.display = 'none';
    document.getElementById('promo-modal').classList.add('open');
  };

  window.closeModal = function() {
    document.getElementById('promo-modal').classList.remove('open');
    editingId = null;
  };

  window.onTypeChange = function() {
    const type = document.querySelector('[name="f-type"]:checked')?.value;
    document.getElementById('f-value-label').textContent =
      type === 'percent' ? 'Giá trị giảm (%) *' : 'Số tiền giảm (đ) *';
  };

  // ── Save (tạo / sửa) ──────────────────────────────────────
  window.savePromo = async function() {
    const errEl  = document.getElementById('modal-error');
    const saveBtn = document.getElementById('save-btn');
    errEl.style.display = 'none';

    const name       = document.getElementById('f-name').value.trim();
    const code       = document.getElementById('f-code').value.trim().toUpperCase();
    const event_type = document.getElementById('f-event-type').value;
    const type       = document.querySelector('[name="f-type"]:checked')?.value;
    const value      = parseFloat(document.getElementById('f-value').value);
    const min_order  = parseInt(document.getElementById('f-min').value) || 0;
    const is_active  = document.getElementById('f-active').checked;
    const description = document.getElementById('f-desc').value.trim() || null;
    const start_date = document.getElementById('f-start').value || null;
    const end_date   = document.getElementById('f-end').value || null;

    // Validate
    if (!name)  return showError('Vui lòng nhập tên khuyến mãi.');
    if (!editingId && !code) return showError('Vui lòng nhập mã khuyến mãi.');
    if (!editingId && !/^[A-Z0-9]+$/.test(code))
      return showError('Mã chỉ gồm chữ hoa và số, không dấu cách.');
    if (!value || value <= 0) return showError('Giá trị giảm phải lớn hơn 0.');
    if (type === 'percent' && value > 100)
      return showError('Giảm % không thể lớn hơn 100%.');
    if (start_date && end_date && start_date > end_date)
      return showError('Ngày kết thúc phải sau ngày bắt đầu.');

    saveBtn.disabled = true;
    saveBtn.textContent = 'Đang lưu...';

    try {
      if (editingId) {
        // PATCH — không gửi code vì không cho sửa
        const updated = await apiUpdatePromotion(editingId, {
          name, type, value, min_order, is_active,
          description, start_date, end_date,
        });
        const idx = allPromos.findIndex(p => p.event_id === editingId);
        if (idx !== -1) allPromos[idx] = updated;
        showToast('Đã cập nhật khuyến mãi!', 'success');
      } else {
        // POST
        const created = await apiCreatePromotion({
          name, code, event_type, type, value, min_order,
          description, start_date, end_date,
        });
        allPromos.unshift(created);
        showToast('Đã tạo khuyến mãi mới!', 'success');
      }
      closeModal();
      renderList();
    } catch (err) {
      showError(err.message);
    } finally {
      saveBtn.disabled = false;
      saveBtn.textContent = 'Lưu';
    }

    function showError(msg) {
      errEl.textContent = msg;
      errEl.style.display = 'block';
    }
  };

  // ── Toggle active ─────────────────────────────────────────
  window.toggleActive = async function(id, currentActive) {
    try {
      const updated = await apiUpdatePromotion(id, { is_active: !currentActive });
      const idx = allPromos.findIndex(p => p.event_id === id);
      if (idx !== -1) allPromos[idx] = updated;
      renderList();
      showToast(!currentActive ? 'Đã kích hoạt khuyến mãi' : 'Đã tạm dừng khuyến mãi', 'success');
    } catch (err) {
      showToast('Lỗi: ' + err.message, 'error');
    }
  };

  // ── Delete ────────────────────────────────────────────────
  window.deletePromo = function(id, name) {
    confirmDialog({
      title: 'Xóa khuyến mãi',
      body: `Bạn có chắc muốn xóa khuyến mãi <strong>${name}</strong>?<br>
             <span style="font-size:12px;color:var(--muted)">
               Nếu mã đã dùng trong đơn hàng, hệ thống sẽ tắt thay vì xóa.
             </span>`,
      confirmLabel: 'Xóa', confirmClass: 'btn-danger',
      onConfirm: async () => {
        try {
          const result = await apiDeletePromotion(id);
          // Backend có thể tắt thay vì xóa nếu đã dùng trong đơn
          if (result?.message?.includes('tắt')) {
            const idx = allPromos.findIndex(p => p.event_id === id);
            if (idx !== -1) allPromos[idx].is_active = false;
            showToast('Khuyến mãi đã dùng trong đơn hàng — đã tắt thay vì xóa', 'info');
          } else {
            allPromos = allPromos.filter(p => p.event_id !== id);
            showToast('Đã xóa khuyến mãi', 'success');
          }
          renderList();
        } catch (err) {
          showToast('Lỗi: ' + err.message, 'error');
        }
      },
    });
  };

  // Close khi click backdrop
  document.getElementById('promo-modal').addEventListener('click', e => {
    if (e.target === document.getElementById('promo-modal')) closeModal();
  });

  // Khởi động
  loadPromos();
</script>
</body>
</html>
